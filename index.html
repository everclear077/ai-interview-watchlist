<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0D10" />
<meta name="color-scheme" content="dark light" />
<script>
(function () {
  var THEME_KEY = "wl-theme";
  var LANG_KEY = "wl-lang";
  var theme = "";
  try { theme = localStorage.getItem(THEME_KEY) || ""; } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute("content", theme === "light" ? "#E4DDD0" : "#0B0D10");

  var lang = "";
  try { lang = localStorage.getItem(LANG_KEY) || ""; } catch (e) {}
  if (lang !== "zh" && lang !== "en") {
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e2) {}
    var china = tz === "Asia/Shanghai" || tz === "Asia/Chongqing" || tz === "Asia/Urumqi" || tz === "Asia/Harbin" || tz === "PRC";
    if (!tz) {
      try { china = new Date().getTimezoneOffset() === -480; } catch (e3) { china = false; }
    }
    lang = china ? "zh" : "en";
  }
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
})();
</script>
<title>长镜 · AI</title>
<meta name="description" content="精选 AI / 科技长视频访谈，带精读、解读与文稿。" />

<meta property="og:description" content="精选 AI / 科技长视频访谈，带精读、解读与文稿。" />
<meta property="og:type" content="website" />
<script>
(function () {
  if (document.documentElement.getAttribute("data-lang") !== "en") return;
  document.title = "Long Lens AI";
  var og = document.querySelector('meta[property="og:title"]');
  if (og) og.setAttribute("content", "Long Lens AI");
})();
</script>
