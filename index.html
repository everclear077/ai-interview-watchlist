<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#141414" />
<title>AI / 科技访谈 · 观看列表</title>
<!--
  Midnight — refined dark graphite with muted gold accent
  Shared: covers (coverDataUri), wide summary (~78ch), localStorage ai-interviews-watched-v1
-->
<style>

  :root {
    --paper: #141414; --paper-deep: #1c1c1c; --surface: #1a1a1a;
    --ink: #e8e6e3; --ink-soft: #c8c4be; --muted: #9a958c; --faint: #6e695f;
    --line: #2a2a2a; --line-strong: #3a3a3a;
    --accent: #c4a574; --accent-soft: rgba(196,165,116,0.12); --accent-line: rgba(196,165,116,0.35);
    --ok: #7a9e84; --ok-soft: rgba(122,158,132,0.15);
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.25);
    --font: "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Helvetica,Arial,sans-serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ease: 140ms ease;
    --cover-w: 184px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); background:var(--paper); color:var(--ink); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  code { font-family:var(--mono); font-size:0.86em; background:var(--paper-deep); padding:1px 5px; border-radius:4px; color:var(--ink-soft); }
  .shell { max-width:1120px; margin:0 auto; padding:0 28px 72px; }
  .topbar { position:sticky; top:0; z-index:40; background:rgba(20,20,20,0.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .topbar-inner { max-width:1120px; margin:0 auto; padding:18px 28px 16px; display:flex; flex-wrap:wrap; gap:14px 28px; align-items:flex-end; justify-content:space-between; }
  .brand .kicker { font-size:0.68rem; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; }
  .brand h1 { margin:0; font-size:1.35rem; font-weight:550; letter-spacing:-0.025em; }
  .brand .sub { margin-top:6px; font-size:0.78rem; color:var(--faint); }
  .stats { display:flex; flex-wrap:wrap; gap:6px; }
  .stat { display:inline-flex; align-items:baseline; gap:6px; padding:6px 12px; background:var(--surface); border:1px solid var(--line); border-radius:999px; font-size:0.75rem; color:var(--muted); }
  .stat strong { font-weight:600; font-variant-numeric:tabular-nums; font-size:0.88rem; color:var(--ink); }
  .stat.today { background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); }
  .stat.today strong { color:var(--accent); }
  .toolbar { margin-top:20px; }
  .seg { display:inline-flex; flex-wrap:wrap; gap:2px; padding:3px; background:var(--paper-deep); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  .tab { appearance:none; border:none; background:transparent; color:var(--muted); border-radius:7px; padding:7px 14px; font-size:0.8rem; font-weight:500; cursor:pointer; font-family:inherit; }
  .tab.active { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.3); }
  .row2 { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; }
  .pri-group,.extra { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .label-mini { font-size:0.68rem; color:var(--faint); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; margin-right:2px; }
  .chip,.toggle { appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:5px 11px; font-size:0.78rem; font-weight:500; cursor:pointer; font-family:inherit; }
  .chip.active { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .toggle.active { background:var(--ok-soft); border-color:color-mix(in srgb,var(--ok) 35%,var(--line)); color:var(--ok); }
  .search { flex:1 1 220px; min-width:180px; position:relative; }
  .search .icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); }
  .search input { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:8px 12px 8px 34px; font-size:0.86rem; font-family:inherit; outline:none; }
  .search input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .section-label { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 14px; }
  .section-label h2 { margin:0; font-size:0.72rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); }
  .section-label .hint,.list-head .count { font-size:0.75rem; color:var(--faint); }
  .today-rail {
    margin: 14px 0 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 8px 12px;
    border: 1px solid var(--accent-line);
    background: var(--accent-soft);
    border-radius: 10px;
  }
  .today-rail[hidden] { display: none !important; }
  .today-badge {
    flex: 0 0 auto;
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a1612; background: var(--accent);
    padding: 3px 8px; border-radius: 999px;
  }
  .today-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
  .today-chip {
    appearance: none; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--accent-line); background: var(--surface);
    color: var(--ink-soft); font-size: 0.78rem; text-align: left;
  }
  .today-chip:hover { border-color: var(--accent); color: var(--ink); }
  .today-chip .pri { font-family: var(--mono); font-size: 0.65rem; font-weight: 600; color: var(--accent); }
  .today-chip .t { font-weight: 550; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
  .today-chip .g { color: var(--faint); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 14ch; }
  .today-rail .hint { font-size: 0.72rem; color: var(--faint); margin-left: auto; }
  .card.today-target { outline: 1px solid var(--accent-line); background: #1e1c18; }
  .list-head { margin: 28px 0 14px; }
  .cards { display:grid; gap:0; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; }
  .card { border-bottom:1px solid var(--line); }
  .cards > .card:last-child { border-bottom:none; }
  .card:hover { background:#1e1e1e; }
  .card.watched { opacity:0.45; }
  .card.watched .title { text-decoration:line-through; color:var(--muted); }
  .check { padding-top:4px; }
  .check input { width:17px; height:17px; accent-color:var(--ok); cursor:pointer; margin:0; }
  .cover { border-color:var(--line-strong) !important; }
  .meta-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
  .badge { font-family:var(--mono); font-size:0.65rem; font-weight:600; letter-spacing:0.04em; padding:2px 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted); background:var(--paper); }
  .badge.P0 { color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .badge.P1 { color:var(--ink-soft); background:var(--paper-deep); }
  .badge.P2 { color:var(--faint); background:transparent; }
  .cat { font-size:0.7rem; color:var(--faint); padding:2px 8px; border-radius:4px; border:1px solid var(--line); }
  .cat.featured { color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .title { margin:0 0 4px; font-size:1.08rem; font-weight:560; letter-spacing:-0.018em; line-height:1.35; color:var(--ink); }
  .guest-line { font-size:0.88rem; color:var(--ink-soft); margin-bottom:8px; }
  .guest-line .sep { color:var(--faint); margin:0 7px; }
  .facts { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:0.76rem; color:var(--faint); margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .summary { color:var(--ink-soft); }
  .advice { font-size:0.84rem; color:var(--muted); background:var(--paper); border-left:2px solid var(--accent-line); padding:8px 12px; margin:0 0 14px; border-radius:0 6px 6px 0; line-height:1.55; }
  .advice::before { content:"建议 · "; color:var(--accent); font-size:0.72rem; font-weight:500; letter-spacing:0.04em; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:var(--paper-deep); color:var(--ink-soft); font-size:0.78rem; font-weight:500; text-decoration:none !important; }
  .btn:first-child { background:var(--accent); border-color:var(--accent); color:#1a1612; }
  .btn:first-child:hover { filter:brightness(1.08); }
  .btn:not(:first-child):hover { border-color:var(--accent-line); background:var(--accent-soft); color:var(--accent); }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:0.78rem; color:var(--faint); line-height:1.75; }
  footer .actions { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  footer button { appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:7px; padding:6px 11px; font-size:0.75rem; font-weight:500; cursor:pointer; font-family:inherit; }
  footer button:hover { color:var(--ink); border-color:var(--line-strong); }

  .card {
    display: grid;
    grid-template-columns: auto var(--cover-w, 180px) minmax(0, 1fr);
    gap: 14px 18px;
    align-items: start;
    padding: 18px 20px 18px;
  }
  .cover {
    display: block;
    width: var(--cover-w, 180px);
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper-deep, #efece7);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cover-empty { background: var(--paper-deep); }
  .body { min-width: 0; }
  .summary {
    font-size: 0.95rem;
    line-height: 1.65;
    max-width: min(78ch, 100%);
    margin: 0 0 12px;
  }
  .advice {
    max-width: min(78ch, 100%);
    width: 100%;
  }
  @media (max-width: 720px) {
    .card {
      grid-template-columns: auto 1fr;
      grid-template-areas:
        "check body"
        "cover cover";
    }
    .check { grid-area: check; }
    .cover { grid-area: cover; width: 100%; max-width: 320px; }
    .body { grid-area: body; }
  }

</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <p class="kicker">Midnight · Graphite queue</p>
        <h1>AI / 科技访谈</h1>
        <div class="sub">上次更新 · <span id="last-updated">—</span> · America/Chicago</div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="shell">
    <section class="toolbar" aria-label="筛选">
      <div class="seg" id="cat-tabs" role="tablist"></div>
      <div class="row2">
        <div class="pri-group">
          <span class="label-mini">优先级</span>
          <button type="button" class="chip active" data-p="all">全部</button>
          <button type="button" class="chip" data-p="P0">P0</button>
          <button type="button" class="chip" data-p="P1">P1</button>
          <button type="button" class="chip" data-p="P2">P2</button>
        </div>
        <div class="search">
          <span class="icon" aria-hidden="true">⌕</span>
          <input id="q" type="search" placeholder="搜索标题 / 嘉宾 / 节目…" autocomplete="off" />
        </div>
        <div class="extra">
          <button type="button" class="toggle" id="only-unwatched">只看未看</button>
        </div>
      </div>
    </section>

    <section class="today-rail" id="suggest-section" aria-label="今日建议">
      <span class="today-badge">今日</span>
      <div id="suggest" class="today-chips"></div>
      <span class="hint">未看 P0 · 点选跳转</span>
    </section>

    <div class="list-head section-label">
      <h2>全部访谈</h2>
      <div class="count" id="list-count"></div>
    </div>
    <div class="cards" id="cards"></div>

    <footer>
      <div>日更由 R 维护；打勾仅保存在本浏览器（上线后可由 W 做账号同步）。</div>
      <div>数据源优先读取同目录 <code>data.json</code>；若不可用则使用页内嵌入数据（可单独打开本 HTML）。</div>
      <div class="actions">
        <button type="button" id="btn-export">导出进度 JSON</button>
        <button type="button" id="btn-reset">清除本机打勾</button>
      </div>
    </footer>
  </main>

  <script>

  (function () {
    const LS_KEY = "ai-interviews-watched-v1";

    
    const EMBEDDED_DATA = null;

    const state = {
      data: null,
      watched: {},
      category: "全部",
      priority: "all",
      onlyUnwatched: false,
      query: ""
    };


    function todayISO() {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Chicago",
          year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());
      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function loadWatched() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        state.watched = raw ? JSON.parse(raw) : {};
      } catch (e) {
        state.watched = {};
      }
    }

    function saveWatched() {
      localStorage.setItem(LS_KEY, JSON.stringify(state.watched));
      if (state.data && state.data.items) {
        state.data.items.forEach(function (it) {
          it.watched = !!state.watched[it.id];
        });
      }
    }

    function isWatched(id) {
      return !!state.watched[id];
    }

    function setWatched(id, val) {
      if (val) state.watched[id] = true;
      else delete state.watched[id];
      saveWatched();
      renderAll();
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function coverSrc(it) {
      if (it.coverDataUri) return it.coverDataUri;
      if (it.cover) return it.cover;
      return "";
    }

    function matches(it) {
      if (state.category !== "全部" && it.category !== state.category) return false;
      if (state.priority !== "all" && it.priority !== state.priority) return false;
      if (state.onlyUnwatched && isWatched(it.id)) return false;
      const q = state.query.trim().toLowerCase();
      if (q) {
        const blob = [it.title, it.guest, it.show, it.summary, it.advice, it.category]
          .join(" ").toLowerCase();
        if (blob.indexOf(q) === -1) return false;
      }
      return true;
    }

    function sortItems(items) {
      const pri = { P0: 0, P1: 1, P2: 2 };
      return items.slice().sort(function (a, b) {
        const pa = pri[a.priority] != null ? pri[a.priority] : 9;
        const pb = pri[b.priority] != null ? pri[b.priority] : 9;
        if (pa !== pb) return pa - pb;
        return (b.date || "").localeCompare(a.date || "");
      });
    }

    function renderStats() {
      const items = state.data.items;
      const total = items.length;
      const watched = items.filter(function (it) { return isWatched(it.id); }).length;
      const pending = total - watched;
      const today = todayISO();
      const addedToday = items.filter(function (it) { return it.addedAt === today; }).length;
      document.getElementById("stats").innerHTML =
        '<div class="stat">待看 <strong>' + pending + '</strong></div>' +
        '<div class="stat">已看 <strong>' + watched + '</strong></div>' +
        '<div class="stat today">今日新增 <strong>' + addedToday + '</strong></div>';
      document.getElementById("last-updated").textContent = state.data.lastUpdated || "—";
    }

    function cardHtml(it, opts) {
      opts = opts || {};
      const watched = isWatched(it.id);
      const urls = (it.urls || []).map(function (u) {
        return '<a class="btn" href="' + escapeHtml(u.href) + '" target="_blank" rel="noopener noreferrer">' +
          escapeHtml(u.label) + ' <span class="arrow" aria-hidden="true">↗</span></a>';
      }).join("");
      const src = coverSrc(it);
      const cover = src
        ? '<a class="cover" href="' + escapeHtml((it.urls && it.urls[0] && it.urls[0].href) || "#") +
          '" target="_blank" rel="noopener noreferrer" tabindex="-1">' +
          '<img src="' + src + '" alt="" loading="lazy" width="180" height="101" /></a>'
        : '<div class="cover cover-empty" aria-hidden="true"></div>';
      return (
        '<article class="card' + (watched ? " watched" : "") + '" data-id="' + escapeHtml(it.id) + '">' +
          '<div class="check"><input type="checkbox" ' + (watched ? "checked " : "") +
            'aria-label="标记已看：' + escapeHtml(it.title) + '" data-check="' + escapeHtml(it.id) + '" /></div>' +
          cover +
          '<div class="body">' +
            '<div class="meta-row">' +
              '<span class="badge ' + escapeHtml(it.priority) + '">' + escapeHtml(it.priority) + '</span>' +
              '<span class="cat">' + escapeHtml(it.category) + '</span>' +
              (opts.suggest ? '<span class="cat featured">今日推荐</span>' : '') +
            '</div>' +
            '<h3 class="title">' + escapeHtml(it.title) + '</h3>' +
            '<div class="guest-line">' + escapeHtml(it.guest) +
              '<span class="sep">·</span>' + escapeHtml(it.show) + '</div>' +
            '<div class="facts">' +
              '<span>' + escapeHtml(it.date) + '</span>' +
              '<span>' + escapeHtml(it.duration || "—") + '</span>' +
            '</div>' +
            '<p class="summary">' + escapeHtml(it.summary) + '</p>' +
            '<p class="advice">' + escapeHtml(it.advice) + '</p>' +
            '<div class="links">' + urls + '</div>' +
          '</div>' +
        '</article>'
      );
    }

    function todayPicks() {
      return sortItems(state.data.items)
        .filter(function (it) { return it.priority === "P0" && !isWatched(it.id); })
        .slice(0, 2);
    }

    function renderSuggest() {
      const section = document.getElementById("suggest-section");
      const el = document.getElementById("suggest");
      if (!section || !el) return;
      const picks = todayPicks();
      if (!picks.length) {
        section.hidden = true;
        el.innerHTML = "";
        return;
      }
      section.hidden = false;
      el.innerHTML = picks.map(function (it) {
        return '<button type="button" class="today-chip" data-jump="' + escapeHtml(it.id) + '" title="' +
          escapeHtml(it.title) + ' · ' + escapeHtml(it.guest) + '">' +
          '<span class="pri">P0</span>' +
          '<span class="t">' + escapeHtml(it.title) + '</span>' +
          '<span class="g">' + escapeHtml(it.guest) + '</span>' +
          '</button>';
      }).join("");
    }

    function jumpToCard(id) {
      const card = document.querySelector('.card[data-id="' + id.replace(/"/g, '\"') + '"]');
      if (!card) return;
      document.querySelectorAll(".card.today-target").forEach(function (c) { c.classList.remove("today-target"); });
      card.classList.add("today-target");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(function () { card.classList.remove("today-target"); }, 2200);
    }

    function renderCards() {
      const filtered = sortItems(state.data.items.filter(matches));
      const box = document.getElementById("cards");
      document.getElementById("list-count").textContent = "显示 " + filtered.length + " / " + state.data.items.length;
      if (!filtered.length) {
        box.innerHTML = '<div class="empty">没有匹配的访谈。试试清除筛选或搜索词。</div>';
        return;
      }
      const suggestIds = {};
      todayPicks().forEach(function (it) { suggestIds[it.id] = true; });
      box.innerHTML = filtered.map(function (it) {
        return cardHtml(it, { suggest: !!suggestIds[it.id] });
      }).join("");
    }

    function renderAll() {
      renderStats();
      renderSuggest();
      renderCards();
    }

    function bindFilters() {
      const cats = ["全部"].concat(state.data.categories || []);
      const tabs = document.getElementById("cat-tabs");
      tabs.innerHTML = cats.map(function (c) {
        return '<button type="button" class="tab' + (c === state.category ? " active" : "") +
          '" data-cat="' + escapeHtml(c) + '" role="tab">' + escapeHtml(c) + '</button>';
      }).join("");

      tabs.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-cat]");
        if (!btn) return;
        state.category = btn.getAttribute("data-cat");
        tabs.querySelectorAll(".tab").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-cat") === state.category);
        });
        renderCards();
      });

      document.querySelector(".pri-group").addEventListener("click", function (e) {
        const btn = e.target.closest("[data-p]");
        if (!btn) return;
        state.priority = btn.getAttribute("data-p");
        document.querySelectorAll(".pri-group .chip").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-p") === state.priority);
        });
        renderCards();
      });

      document.getElementById("only-unwatched").addEventListener("click", function () {
        state.onlyUnwatched = !state.onlyUnwatched;
        this.classList.toggle("active", state.onlyUnwatched);
        renderCards();
      });

      document.getElementById("q").addEventListener("input", function () {
        state.query = this.value;
        renderCards();
      });

      document.body.addEventListener("change", function (e) {
        const t = e.target;
        if (t && t.matches("input[data-check]")) {
          setWatched(t.getAttribute("data-check"), t.checked);
        }
      });

      document.body.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-jump]");
        if (!btn) return;
        jumpToCard(btn.getAttribute("data-jump"));
      });

      document.getElementById("btn-export").addEventListener("click", function () {
        saveWatched();
        const payload = {
          exportedAt: new Date().toISOString(),
          lastUpdated: state.data.lastUpdated,
          items: state.data.items.map(function (it) {
            return {
              id: it.id,
              title: it.title,
              watched: !!it.watched,
              priority: it.priority,
              date: it.date
            };
          })
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ai-interviews-progress.json";
        a.click();
        URL.revokeObjectURL(a.href);
      });

      document.getElementById("btn-reset").addEventListener("click", function () {
        if (!confirm("清除本浏览器中的所有打勾进度？")) return;
        state.watched = {};
        saveWatched();
        renderAll();
      });
    }

    async function loadData() {
      let data = null;
      try {
        const res = await fetch("./data.json", { cache: "no-store" });
        if (res.ok) data = await res.json();
      } catch (e) { /* file:// or offline */ }
      if (!data) {
        data = (typeof EMBEDDED_DATA !== "undefined") ? EMBEDDED_DATA : null;
      }
      if (!data || !Array.isArray(data.items) || data.items.length === 0) {
        const box = document.getElementById("cards");
        if (box) {
          box.innerHTML = '<div class="empty">数据未加载：请用同目录的 data.json，或重新下载完整 HTML</div>';
        }
        state.data = { version: 1, title: "", lastUpdated: "", items: [], categories: [], priorities: [] };
        return;
      }
      state.data = data;
      data.items.forEach(function (it) {
        if (state.watched[it.id]) it.watched = true;
        else if (it.watched) state.watched[it.id] = true;
        else it.watched = false;
      });
      saveWatched();
    }

    async function boot() {
      loadWatched();
      await loadData();
      bindFilters();
      renderAll();
    }

    boot();
  })();

  </script>
</body>
</html>
