<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirect</title>
<link rel="alternate" type="application/rss+xml" title="长镜 · AI" href="https://everclear077.github.io/ai-interview-watchlist/feed.xml" />
<script>
/* GitHub Pages project-site fallback:
   /ep/<id>/ → /#/ep/<id>
   /show/<slug>/ → /#/show/<slug>
   /topic/<slug>/ → /#/topic/<slug>
*/
(function () {
  var path = location.pathname || "/";
  var m = path.match(/\/(ep|show|topic)\/([^/]+)\/?$/);
  var dest = m
    ? "#/" + m[1] + "/" + decodeURIComponent(m[2]) + (location.search || "")
    : "#/";
  var base = path.replace(/\/(ep|show|topic)\/[^/]*\/?$/, "/");
  if (!/\/$/.test(base)) base += "/";
  location.replace(base + dest);
})();
</script>
</head>
<body>
  <p>Redirecting to <a href="./">home</a>…</p>
</body>
</html>
