<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirect</title>
<script>
/* GitHub Pages project-site fallback: /ep/<id>/ → /#/ep/<id> */
(function () {
  var path = location.pathname || "/";
  var m = path.match(/\/ep\/([^/]+)\/?$/);
  var dest = m ? "#/ep/" + decodeURIComponent(m[1]) : "#/";
  var base = path.replace(/\/ep\/[^/]*\/?$/, "/");
  if (!/\/$/.test(base)) base += "/";
  location.replace(base + dest);
})();
</script>
</head>
<body>
  <p>Redirecting to <a href="./">home</a>…</p>
</body>
</html>
